<!doctype html>
<html lang="en">
  <head>
    <script>
      // Set the site chrome's light/dark mode before first paint, to avoid a flash.
      try {
        var m = localStorage.getItem("core-site-mode") || "light";
        document.documentElement.setAttribute("data-site-mode", m);
      } catch (e) {}
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CORE Design System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inclusive+Sans:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />
    <!--
      Icon set: Font Awesome 6 PRO is CORE's specified icon library (see Foundations → Icons).
      This project has no Pro license/Kit code, so the FREE tier is loaded here as a drop-in
      placeholder — class names (fa-solid, fa-regular, etc.) are compatible with Pro. To upgrade:
      1. Get a Kit code at https://fontawesome.com/kits (uses your Pro license automatically), then
         replace the line below with: <script src="https://kit.fontawesome.com/YOUR_KIT_CODE.js" crossorigin="anonymous"></script>
      OR
      2. npm install with your Pro npm token (https://fontawesome.com/docs/web/setup/packages) and
         import '@fortawesome/fontawesome-pro/css/all.min.css' in main.tsx instead of this CDN link.
    -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
